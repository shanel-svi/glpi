<VirtualHost *:80>
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://itsm.shanel.com$1 [R=301,L]
</VirtualHost>

<VirtualHost *:8080>
    SetEnv GLPI_ENVIRONMENT_TYPE testing

    Include vhosts/glpi-common.conf
</VirtualHost>

<VirtualHost *:8090>
    SetEnv GLPI_ENVIRONMENT_TYPE e2e_testing

    Include vhosts/glpi-common.conf
</VirtualHost>
